name: App release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:sync
        working-directory: frontend

  windows:
    needs: verify-sync
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:MAKE_INSTALLER = "1"
          $env:MAKE_ZIP = "0"
          ./desktop/build.ps1

      - name: Verify bundle contents
        shell: pwsh
        run: ./desktop/verify_windows_bundle.ps1 -DistDir desktop/dist/F1nancer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: f1nancer-windows
          path: desktop/dist/F1nancer-*-setup.exe
          if-no-files-found: error

  macos:
    needs: verify-sync
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Mac DMG
        env:
          INSTALL: "0"
          MAKE_DMG: "1"
        run: |
          set -euo pipefail
          chmod +x desktop/build.sh desktop/install.sh desktop/make_dmg.sh
          ./desktop/build.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: f1nancer-macos
          path: desktop/dist/F1nancer-*.dmg
          if-no-files-found: error

  android:
    needs: verify-sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve APP_VERSION
        id: version
        working-directory: .
        run: |
          version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/app/version.py)"
          if [[ -z "$version" ]]; then
            echo "Could not read APP_VERSION from backend/app/version.py" >&2
            exit 1
          fi
          echo "name=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK locally
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          for key in EAS_PROJECT_ID EXPO_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret/env: $key" >&2
              exit 1
            fi
          done
          mkdir -p dist
          eas build \
            --platform android \
            --profile apk \
            --non-interactive \
            --local \
            --output "dist/F1nancer-${VERSION}.apk"
          unzip -tq "dist/F1nancer-${VERSION}.apk"
          ls -lh "dist/F1nancer-${VERSION}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: f1nancer-android
          path: mobile/dist/F1nancer-*.apk
          if-no-files-found: error

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/app/version.py)"
            if [[ -z "$version" ]]; then
              echo "Could not read APP_VERSION from backend/app/version.py" >&2
              exit 1
            fi
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
