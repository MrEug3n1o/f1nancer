name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:MAKE_INSTALLER = "1"
          $env:MAKE_ZIP = "0"
          ./desktop/build.ps1

      - name: Verify bundle contents
        shell: pwsh
        run: ./desktop/verify_windows_bundle.ps1 -DistDir desktop/dist/F1nancer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: f1nancer-windows
          path: desktop/dist/F1nancer-*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Mac DMG
        env:
          INSTALL: "0"
          MAKE_DMG: "1"
        run: |
          chmod +x desktop/build.sh desktop/install.sh desktop/make_dmg.sh
          ./desktop/build.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: f1nancer-macos
          path: desktop/dist/F1nancer-*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/app/version.py)"
            if [[ -z "$version" ]]; then
              echo "Could not read APP_VERSION from backend/app/version.py" >&2
              exit 1
            fi
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
