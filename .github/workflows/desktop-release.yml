name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:MAKE_INSTALLER = "1"
          $env:MAKE_ZIP = "0"
          ./desktop/build.ps1

      - name: Verify bundle contents
        shell: pwsh
        run: ./desktop/verify_windows_bundle.ps1 -DistDir desktop/dist/F1nancer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: f1nancer-windows
          path: desktop/dist/F1nancer-*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Mac DMG
        env:
          INSTALL: "0"
          MAKE_DMG: "1"
        run: |
          chmod +x desktop/build.sh desktop/install.sh desktop/make_dmg.sh
          ./desktop/build.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: f1nancer-macos
          path: desktop/dist/F1nancer-*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
